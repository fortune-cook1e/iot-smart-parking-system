# .github/workflows/deploy-server.yml
name: Deploy Server to Aliyun

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/server/**'
      - 'packages/shared-schemas/**'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - '.github/workflows/deploy-server.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          PORT=3000
          NODE_ENV=production
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
          EOF

      - name: Copy files to Aliyun server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          port: ${{ secrets.ALIYUN_PORT }}
          source: '.,!.git,!node_modules,!apps/mobile,!apps/dashboard,!docs,!screenshots'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          port: ${{ secrets.ALIYUN_PORT }}
          command_timeout: 30m
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "🛑 Stopping old containers"
            docker compose -f docker-compose.prod.yml down

            echo "🧹 Cleaning docker cache"
            docker builder prune -f
            docker image prune -f

            echo "🔨 Building images"
            DOCKER_BUILDKIT=1 docker compose -f docker-compose.prod.yml build --no-cache

            echo "🗄️ Starting database only"
            docker compose -f docker-compose.prod.yml up -d postgres

            echo "⏳ Waiting for database to be ready"
            sleep 10

            echo "🧬 Running Prisma migrate"
            docker compose -f docker-compose.prod.yml run --rm server sh -c \
              "cd /app/apps/server && npx prisma migrate deploy"

            echo "🚀 Starting server"
            docker compose -f docker-compose.prod.yml up -d server

            echo "⏳ Waiting for server startup"
            sleep 15

            echo "📊 Checking status"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=50 server

            echo "🩺 Health check"
            curl -f http://localhost:3000/health

            echo "✅ Deployment successful!"
