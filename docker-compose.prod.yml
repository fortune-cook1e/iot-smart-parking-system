# docker-compose.prod.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: ht2025-parking-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parking-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ht2025-parking-server:latest
    container_name: ht2025-parking-server
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parking-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres_data:
    driver: local

networks:
  parking-network:
    driver: bridge